name: Build APK

on:
  push:
    branches: [ "main" ]
    tags:
      - '*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.2'

    - name: Extract version name
      id: version
      run: |
        VERSION=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
        echo "versionName=$VERSION" >> $GITHUB_OUTPUT

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Rename APK
      run: mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/${{ steps.version.outputs.versionName }}.apk"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.version.outputs.versionName }}
        path: app/build/outputs/apk/debug/${{ steps.version.outputs.versionName }}.apk
        retention-days: 14
